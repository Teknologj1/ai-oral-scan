services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_oral_scan}
      POSTGRES_USER: ${POSTGRES_USER:-ai_oral_scan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_oral_scan} -d ${POSTGRES_DB:-ai_oral_scan}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
